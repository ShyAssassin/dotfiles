theme = "pinkcpp"

[editor]
rulers = [145]
auto-pairs = true
color-modes = true
auto-format = false
bufferline = "always"
completion-timeout = 5
line-number = "relative"
default-line-ending = "lf"
middle-click-paste = false
insert-final-newline = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"

[keys.normal]
"C-p" = "file_picker"
"C-tab" = "buffer_picker"
"C-/" = "toggle_comments"

"C-left" = "move_prev_word_end"
"C-right" = "move_next_word_start"

"C-up" = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
  "select_mode",
  "goto_line_end",
  "normal_mode",
] # Move line(s) up
"C-down" = [
  "extend_to_line_bounds",
  "delete_selection",
  "paste_after",
  "select_mode",
  "goto_line_end",
  "normal_mode",
] # Move line(s) down


[keys.insert]
"C-z" = "undo"
"C-Z" = "redo"
"C-/" = "toggle_comments"
"C-esc" = "keep_primary_selection"

"C-left" = "move_prev_word_end"
"C-right" = "move_next_word_start"
"C-S-up" = "copy_selection_on_prev_line"
"C-S-down" = "copy_selection_on_next_line"
